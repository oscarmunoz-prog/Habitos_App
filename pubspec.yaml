name: habitosapp
description: "HabitosApp - Registro de hábitos diarios con persistencia local mediante shared_preferences"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Persistencia local clave-valor (String, int, bool, double, List<String>)
  shared_preferences: ^2.5.6
  # Para formatear fechas con DateFormat (ver lib/services/fechas.dart)
  intl: ^0.20.3
  sqflite: ^2.4.5
  sqflite_common_ffi_web: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

